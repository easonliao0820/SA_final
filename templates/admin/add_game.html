{% extends 'base.html' %}

{% block title %}新增桌遊 — 桌遊管理系統{% endblock %}

{% block content %}

<div class="page-header">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('admin.dashboard') }}" class="text-decoration-none text-muted">管理後台</a>
                </li>
                <li class="breadcrumb-item active fw-semibold" style="color:var(--primary)">新增桌遊</li>
            </ol>
        </nav>
    </div>
</div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">

                <h5 class="fw-bold mb-4" style="color:var(--primary)">
                    <i class="fas fa-plus-circle me-2" style="color:var(--accent)"></i>新增桌遊資料
                </h5>

                <form method="POST" action="{{ url_for('admin.add_game') }}" enctype="multipart/form-data">

                    <!-- 名稱 -->
                    <div class="mb-3">
                        <label class="form-label" for="name">
                            桌遊名稱 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="例：卡坦島" required>
                    </div>

                    <!-- 年齡 / 人數 / 時長 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="age">適合年齡</label>
                            <input type="text" class="form-control" id="age" name="age"
                                   placeholder="例：10+">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="people">遊戲人數</label>
                            <input type="text" class="form-control" id="people" name="people"
                                   placeholder="例：2-4人">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="time">遊戲時長</label>
                            <input type="text" class="form-control" id="time" name="time"
                                   placeholder="例：60-90分鐘">
                        </div>
                    </div>

                    <!-- 圖片上傳 -->
                    <div class="mb-3">
                        <label class="form-label" for="img">封面圖片</label>
                        <input type="file" class="form-control" id="img" name="img"
                               accept=".jpg,.jpeg,.png,.gif,.webp"
                               onchange="updatePreview(this)">
                        <div class="mt-2" id="img-preview-wrap" style="display:none">
                            <img id="img-preview" src="" alt="預覽"
                                 class="rounded-2 shadow-sm" style="max-height:150px; max-width:100%">
                        </div>
                    </div>

                    <!-- Tags -->
                    <div class="mb-4">
                        <label class="form-label">遊戲分類</label>
                        <div class="tag-checkbox-group" id="tag-group">
                            {% for tag in tags %}
                            <label class="tag-checkbox-label" id="label-{{ tag.tagId }}">
                                <input type="checkbox" name="tags" value="{{ tag.tagId }}"
                                       onchange="updateTagStyle(this)">
                                {{ tag.tagName }}
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i>取消
                        </a>
                        <button type="button" class="btn btn-primary-custom"
                                data-bs-toggle="modal" data-bs-target="#confirmModal">
                            <i class="fas fa-floppy-disk me-2"></i>儲存桌遊
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- 確認新增 Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">
                    <i class="fas fa-plus-circle me-2" style="color:var(--accent)"></i>確認新增
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                確定要新增這筆桌遊資料嗎？
            </div>
            <div class="modal-footer">
                <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-xmark me-1"></i>否
                </a>
                <button type="button" class="btn btn-primary-custom" id="confirmSave">
                    <i class="fas fa-check me-1"></i>是
                </button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function updatePreview(input) {
    const wrap = document.getElementById('img-preview-wrap');
    const img  = document.getElementById('img-preview');
    const file = input.files[0];
    if (file) {
        img.src = URL.createObjectURL(file);
        wrap.style.display = 'block';
    } else {
        wrap.style.display = 'none';
    }
}

function updateTagStyle(checkbox) {
    const label = checkbox.closest('.tag-checkbox-label');
    label.classList.toggle('checked', checkbox.checked);
}

document.getElementById('confirmSave').addEventListener('click', function () {
    document.querySelector('form').submit();
});
</script>
{% endblock %}
